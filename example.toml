db_path = ".\\databases\\" # 解密后的数据库目录路径
pic_path = ".\\chatpic\\" # chatpic目录路径，留空则不导出图片资源

output_path = "" # 导出的路径，留空默认为数据库上级目录

c2c_filters = [] # 需要输出的私聊消息的QQ号列表，留空导出全部
group_filters = [] # 需要输出的群聊消息的群号列表，留空导出全部

# 需要导出的会话类型：c2c（私聊）、group（群聊）、dataline（跨设备同步）
conversation_types = ["c2c", "group", "dataline"]
# 数据线中代表本机的设备：pc、phone 或 pad
dataline_owner = "pc"

# 导出格式：chatlab_json（ChatLab JSON）、chatlab_jsonl（ChatLab JSONL）、html（HTML 单文件）
output_format = ["chatlab_json", "html"]
# JSONL 流式导出时每批从数据库读取的消息数，默认 1000
stream_batch_size = 1000

# 是否复制资源文件到导出目录（true=复制到 output/resources/，false=HTML 直接指向 pic_path）
copy_resources = true

# 可选：QQ NT 的 nt_data/avatar 目录（也可填写 nt_data 目录）
# 配置后 HTML 会优先复制本地头像；embed_avatars=true 时 ChatLab 会嵌入 Data URL
avatar_path = ""
# 可选：QQ NT 的 nt_data 或 EmojiSystermResource 目录
# 留空时 HTML 会从 emoji.db 的 QQ 官方资源包按需下载系统表情
emoji_path = ""
embed_avatars = false

# ============================================================================
# 媒体资源落地（可选配置，未来扩展）
# ============================================================================
# ptt_path = ""           # 语音缓存目录（待提供后激活语音落地）
# video_path = ""         # 视频缓存目录（待提供后激活视频落地）
# file_path = ""          # 文件缓存目录（待提供后激活文件落地）
# silk_transcode = false  # 是否启用 silk→mp3 转码（需 graiax-silkcoder 库）
